<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logoIcon.png" />

    <!-- Google Analytics 4 (skip during prerender/headless) -->
    <script>
      (function () {
        if (typeof window === "undefined") return;
        var ua = (navigator && navigator.userAgent) || "";
        var isPrerender =
          window.__PRERENDERING__ ||
          /HeadlessChrome/i.test(ua || "") ||
          /ReactSnap/i.test(ua || "");
        if (isPrerender) {
          window.__PRERENDERING__ = true;
          return;
        }

        window.dataLayer = window.dataLayer || [];
        function gtag() {
          window.dataLayer.push(arguments);
        }
        window.gtag = gtag;

        var script = document.createElement("script");
        script.async = true;
        script.src =
          "https://www.googletagmanager.com/gtag/js?id=G-HZPPN39S9E";
        document.head.appendChild(script);

        gtag("js", new Date());
        gtag("config", "G-HZPPN39S9E");
      })();
    </script>

    <!--
      IMPORTANT:
      Do NOT put title, meta description, Open Graph,
      or Twitter tags here.

      All SEO is handled inside React per route.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
